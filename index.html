<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boostraps</title>
    <link rel="stylesheet" href="style.css">
    <!--Triado de el b boton de boostraps   baja y encuentras la seccion Include via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>
<body>
    <!--cuando pongo col-1 le estoy dicuendo el espacio que va ocupar por tanto para este ejemplo tiene un espacio de 1*/--> 
    <div class="container text-center mt-5">
        <div class="row align-items-start">
            <div class="col-1 bg-danger">1</div> 
            <div class="col-1 bg-success">2</div>
            <div class="col-1 bg-primary">3</div>
            <div class="col-1 bg-danger">4</div>
            <div class="col-1 bg-success">5</div>
            <div class="col-1 bg-primary">6</div>
            <div class="col-1 bg-info">7</div>
            <div class="col-1 bg-primary">8</div>
            <div class="col-1 bg-danger">9</div>
            <div class="col-1 bg-success">10</div>
            <div class="col-1 bg-primary">11</div>
            <div class="col-1 bg-success ">12</div>
        </div>
    </div>

    <div class="container text-center mt-5">
        <div class="row align-items-start">
            <div class="col-2 bg-danger">1</div> 
            <div class="col-2 bg-success">2</div>
            <div class="col-2 bg-primary">3</div>
            <div class="col-2 bg-danger">4</div>
            <div class="col-2 bg-success">5</div>
            <div class="col-2 bg-primary">6</div>
        </div>
    </div>

    <div class="container text-center mt-5">
        <div class="row align-items-start">
            <div class="col-3 bg-danger">1</div> 
            <div class="col-3 bg-success">2</div>
            <div class="col-3 bg-primary">3</div>
            <div class="col-3 bg-danger">4</div>
        </div>
    </div>

    <div class="container text-center mt-5">
        <div class="row align-items-start">
            <div class="col-6 bg-danger">1</div>
            <div class="col-6 bg-primary">4</div>
        </div>
    </div>

    <div class="container text-center mt-5">
        <div class="row align-items-start">
            <div class="col-1 bg-danger">1</div>
            <div class="col-11 bg-primary">4</div>
        </div>
    </div>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
</body>
</html>
